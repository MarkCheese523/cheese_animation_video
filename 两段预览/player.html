<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A社的F股 · 点阵 MG 网页播放器</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <main class="preview-shell">
    <div class="phone">
      <svg id="scene" viewBox="0 0 1080 1920" role="img" aria-label="A社的F股点阵动画预览">
        <defs>
          <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#102a22" flood-opacity=".2"/></filter>
          <pattern id="dotFill" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.8" fill="#102a22"/><circle cx="18" cy="18" r="2.2" fill="#102a22"/></pattern>
          <pattern id="greenDots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.8" fill="#c6ff3d"/><circle cx="17" cy="17" r="2" fill="#c6ff3d" opacity=".55"/></pattern>
        </defs>
        <rect width="1080" height="1920" fill="#f4f0e6"/>
        <g id="grid"/>
        <g id="camera"><g id="sceneRoot"/></g>
        <g id="headerRoot"/>
      </svg>
      <div id="subtitle" class="subtitle"></div>
    </div>
    <audio id="audio" src="../assets/vo-full.mp3" preload="auto"></audio>
    <div class="controls">
      <button id="playButton" type="button">播放</button>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度">
      <span id="timeLabel" class="time">00:00 / 00:10</span>
    </div>
  </main>
  <script src="../subs.js"></script>
  <script src="full-scenes.js"></script>
  <script src="redesign-assets.js"></script>
  <script src="redesign-scenes.js"></script>
  <script src="premium-assets.js"></script>
  <script src="semantic-assets.js"></script>
  <script src="premium-scenes.js"></script>
  <script src="player.js"></script>
</body>
</html>
